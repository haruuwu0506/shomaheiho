<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 1. metaタグによる転送（0秒後に home.html へ移動） -->
    <meta http-equiv="refresh" content="0; url=home.html">
    <title>転送中...</title>
    <!-- 2. JavaScriptによる即時転送 -->
    <script>
        window.location.replace("home.html");
    </script>
</head>
<body>
    <!-- 万が一リダイレクトが作動しなかった場合のフォールバック表示 -->
    <p>自動的にページが切り替わらない場合は、<a href="home.html">こちら</a>をクリックしてください。</p>
</body>
</html>
